name: Build iOS ipa

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project (xcodegen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -e
          xcodebuild -project ProezdDemo.xcodeproj \
            -scheme ProezdDemo \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            archive -archivePath build/ProezdDemo.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Make unsigned ipa
        run: |
          mkdir -p ipa/Payload
          cp -R "build/ProezdDemo.xcarchive/Products/Applications/ProezdDemo.app" ipa/Payload/
          cd ipa
          zip -qry ProezdDemo.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProezdDemo-unsigned-ipa
          path: ipa/ProezdDemo.ipa
